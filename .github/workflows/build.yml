
name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Check project configuration
        run: |
          test -f package.json
          test -f capacitor.config.ts || test -f capacitor.config.json || test -f capacitor.config.js

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web app
        run: npx cap sync ios

      - name: Build unsigned iOS app
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -sdk iphoneos \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          /usr/bin/zip -qr CineJoy.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CineJoy-IPA
          path: CineJoy.ipa
